services:
  # Gateway Service - Monolith serving profile, feed, and uploads
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: trustlink-gateway
    restart: unless-stopped
    ports:
      - "80:8080"
      - "8080:8080"
    environment:
      - GATEWAY_PORT=8080
      - FIREBASE_PROJECT_ID=trustlink-1bae8
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://10.0.2.2:8080,http://35.253.120.86:8080,http://35.253.120.86
      - ENV=dev
    networks:
      - trustlink-network

networks:
  trustlink-network:
    driver: bridge
